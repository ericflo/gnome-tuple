# Mouse and keys for the camera tile (bin/tuple-selfcam). Dragging moves the
# window by itself (mpv's window-dragging); these are everything else.
WHEEL_UP       add current-window-scale 0.1
WHEEL_DOWN     add current-window-scale -0.1
MBTN_LEFT_DBL  cycle-values current-window-scale 0.4 0.8
q              quit
ESC            quit
